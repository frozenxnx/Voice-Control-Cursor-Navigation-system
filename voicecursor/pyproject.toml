[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicecursor"
version = "0.1.0"
description = "Voice-controlled cursor navigation for Windows"
requires-python = ">=3.10"
dependencies = [
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
    "uiautomation>=2.0.20; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
voicecursor = "voicecursor.__main__:main"

[tool.setuptools.packages.find]
include = ["voicecursor*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
